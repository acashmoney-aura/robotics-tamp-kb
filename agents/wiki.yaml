role: wiki
label: KRAIL Wiki Writer
purpose: Turn source-backed topics into concise encyclopedia-style wiki pages with
  useful rich artifacts.
runner:
  default: codex_cli
  approval_required: false
  max_retries: 1
permissions:
  read:
  - rail.yaml
  - .krail/pack.yaml
  - research_plan
  - topics
  - docs
  - artifacts
  - agents
  - skills
  - specs
  write:
  - research_plan
  - docs/wiki
  - artifacts/wiki
  - agents
  - skills
  - specs
  deny:
  - .git
  - .krail/vector.sqlite
prompts:
  system: agents/prompts/wiki.md
  checklist: agents/checklists/wiki.md
completion:
  requires:
  - summary
  - changed_files
  - blockers_or_gaps
